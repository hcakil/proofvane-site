name: Deploy production (Cloudflare Pages)

# Production yayını sahibin onayı olmadan yapılmaz.
# - Yalnızca elle tetiklenir (workflow_dispatch) ve "yayinla" onay metni ister.
# - `production` ortamında çalışır: GitHub > Settings > Environments > production
#   altında "Required reviewers" tanımlanmalıdır.
# - Secret/değişken eksikse hiçbir şey yüklemeden hata verip durur.
# - Bu iş akışında yapay zekâ/API çağrısı yoktur.
#
# Gerekenler (README "Yayın" bölümü):
#   secrets.CLOUDFLARE_API_TOKEN   (Account > Cloudflare Pages > Edit)
#   secrets.CLOUDFLARE_ACCOUNT_ID
#   vars.CF_PAGES_PROJECT          (Direct Upload Pages projesinin adı)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Production yayınını onaylamak için "yayinla" yazın'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Pages (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      - name: Ön koşulları denetle
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          fail=0
          if [ "$CONFIRM" != "yayinla" ]; then
            echo "::error::Onay metni hatalı (beklenen: yayinla). Yayın iptal edildi."; fail=1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Production yalnızca main dalından yayınlanır (şu an: $REF)."; fail=1
          fi
          if [ "$HAS_API_TOKEN" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret'ı tanımlı değil (production ortamı ya da repo secret'ı)."; fail=1
          fi
          if [ "$HAS_ACCOUNT_ID" != "true" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret'ı tanımlı değil."; fail=1
          fi
          if [ -z "$CF_PAGES_PROJECT" ]; then
            echo "::error::CF_PAGES_PROJECT değişkeni tanımlı değil (Settings > Secrets and variables > Actions > Variables)."; fail=1
          elif ! printf '%s' "$CF_PAGES_PROJECT" | grep -Eq '^[a-z0-9][a-z0-9-]{0,57}$'; then
            echo "::error::CF_PAGES_PROJECT geçersiz: yalnızca küçük harf, rakam ve tire."; fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "Yayın yapılmadı. README'deki 'Yayın' bölümündeki adımları tamamlayın."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      - name: Yayın öncesi uyarılar
        run: |
          if grep -q 'name="robots" content="noindex' dist/index.html; then
            echo "::warning::Sayfa hâlâ noindex (site.config.ts > indexable: false). Arama motorlarında görünmez."
          fi
          if grep -q 'data-testid="contact-fallback"' dist/index.html; then
            echo "::warning::İletişim adresi tanımlı değil (contactEmail: null)."
          fi

      - name: Cloudflare Pages'e yükle
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true

      - name: Özet
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Yayınlandı: $URL" >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Alternatif hedefler (kullanılmıyor, yalnızca başvuru için):
      #
      # GitHub Pages (permissions: pages: write, id-token: write gerekir):
      #   - uses: actions/upload-pages-artifact@v4
      #     with: { path: dist }
      #   - uses: actions/deploy-pages@v4
      #
      # Vercel (secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID):
      #   - run: npx vercel deploy dist --prod --token="$VERCEL_TOKEN"
      # ------------------------------------------------------------------
